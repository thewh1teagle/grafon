[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grafon-urdu-g2p"
version = "0.1.0"
description = "Compact, contextual Urdu grapheme-to-IPA implementation for Grafon"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "regex>=2024.5", "safetensors>=0.4"]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.30"]
test = ["pytest>=8"]

[project.scripts]
grafon-urdu-train = "grafon_urdu.train:main"
grafon-urdu = "grafon_urdu.infer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
